name: Scrape All Skin Sources

# ---------------------------------------------------------------------------
# Upload to:  .github/workflows/scrape_all.yml
# Collects from TLauncher + Xyrios + Skindex + NameMC + minecraftskins.net,
# commits skins_all.json, then refreshes the jsDelivr CDN cache.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"     

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ADDED beautifulsoup4 HERE
          pip install beautifulsoup4==4.12.3 cloudscraper==1.2.71 requests playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run multi-source scraper (headful via Xvfb)
        run: xvfb-run -a python scraper_all.py

      - name: Commit and push results
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -s skins_all.json ] || [ "$(tr -d '[:space:]' < skins_all.json)" = "[]" ]; then
            echo "skins_all.json is empty; nothing to commit."
            exit 0
          fi

          git add skins_all.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update skins_all.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              echo "Pushed successfully."
              break
            fi
            echo "Push rejected; syncing with remote (attempt ${attempt})..."
            git pull --rebase --autostash -X theirs origin "${branch}" || true
            sleep $((attempt * 3))
            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: could not push after several attempts."
              exit 1
            fi
          done

      - name: Refresh jsDelivr CDN cache
        run: |
          echo "Purging jsDelivr cache so the CDN serves the latest skins_all.json..."
          curl --silent --show-error --location \
            "https://purge.jsdelivr.net/gh/ORagabO/skins-data@main/skins_all.json" \
            || echo "Purge request failed (CDN will refresh on its own within a few days)."
          echo ""
          echo "CDN URL: https://cdn.jsdelivr.net/gh/ORagabO/skins-data@main/skins_all.json"
