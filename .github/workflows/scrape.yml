name: Scrape Laby.net Skins

on:
  workflow_dispatch: # Allows you to run it manually from the Actions tab
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the data file back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add skins_data.json
          # Only commit if there are changes
          git commit -m "Automated update: laby.net skins data" || exit 0
          git push
