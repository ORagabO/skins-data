name: Scrape Skindex Skins

# ---------------------------------------------------------------------------
# Upload this file to:  .github/workflows/skindex.yml
# Then go to the repo's "Actions" tab, pick "Scrape Skindex Skins",
# and click "Run workflow" to test it immediately.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:        # manual "Run workflow" button (for testing)
  schedule:
    - cron: "0 3 * * 1"     # also runs automatically every Monday at 03:00 UTC

# Allow the job to push the updated JSON back to the repo.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper

      - name: Run Skindex scraper
        run: python scraper_skindex.py

      - name: Commit and push results
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add skindex_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update skindex_data.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
