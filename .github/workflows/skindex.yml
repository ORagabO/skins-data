name: Scrape All Skin Sources

# ---------------------------------------------------------------------------
# Upload to:  .github/workflows/scrape_all.yml
# Collects from laby.net + Skindex + MineSkin, shuffles, commits skins_all.json.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"     # every Monday 03:00 UTC

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper requests playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run multi-source scraper (headful via Xvfb)
        run: xvfb-run -a python scraper_all.py

      - name: Commit and push results
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -s skins_all.json ] || [ "$(tr -d '[:space:]' < skins_all.json)" = "[]" ]; then
            echo "skins_all.json is empty; nothing to commit."
            exit 0
          fi

          git add skins_all.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update skins_all.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected; syncing with remote (attempt ${attempt})..."
            git pull --rebase --autostash -X theirs origin "${branch}" || true
            sleep $((attempt * 3))
          done
          echo "ERROR: could not push after several attempts."
          exit 1
