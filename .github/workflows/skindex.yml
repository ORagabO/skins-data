name: Scrape Skindex Skins

# ---------------------------------------------------------------------------
# Upload this file to:  .github/workflows/skindex.yml   (REPLACE the old one)
# Then open "Actions" -> "Scrape Skindex Skins" -> "Run workflow".
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"     # every Monday 03:00 UTC

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          # Download the Chromium browser AND its OS dependencies.
          python -m playwright install --with-deps chromium

      - name: Run Skindex scraper
        run: python scraper_skindex.py

      - name: Commit and push results
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -s skindex_data.json ] || [ "$(tr -d '[:space:]' < skindex_data.json)" = "[]" ]; then
            echo "skindex_data.json is empty; nothing to commit."
            exit 0
          fi
          git add skindex_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update skindex_data.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
